
services:
  frontend:
    build:
      context: ./frontend
    container_name: earthsage-frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8020
      - VITE_CARTO_API_KEY=${VITE_CARTO_API_KEY:-}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: earthsage-backend
    ports:
      - "8020:8020"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: earthsage-postgres
    restart: unless-stopped
    command: ["postgres", "-p", "5439"]
    ports:
      - "5439:5439"
    environment:
      POSTGRES_DB: earthsage
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - earthsage_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p 5439"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  earthsage_db:
